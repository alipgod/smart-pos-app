						const targetMarginVal = Math.min(99, Math.max(1, parseFloat(pForm.targetMargin) || 60));
						const recPriceExact = curHpp > 0 ? (curHpp / (1 - (targetMarginVal / 100))) : 0;
						const recPriceRound500 = Math.ceil(recPriceExact / 500) * 500;

						return (
							<div className="ka-modal-overlay" onClick={closeProductModal}>
								<div className="ka-modal ka-modal-lg" onClick={e => e.stopPropagation()}>
									<h3>
										{productModal === 'new' ? 'Tambah Produk' : 'Edit Produk'}
										<button onClick={closeProductModal}><Ico size={18}>✖️</Ico></button>
									</h3>
									<div className="ka-field">
										<label>Nama Produk</label>
										<input value={pForm.name} onChange={e => setPForm({ ...pForm, name: e.target.value })} placeholder="Contoh: Es Krim Vanilla Cup" />
									</div>
									<div className="ka-field-row">
										<div className="ka-field">
											<label>Harga Jual (Rp)</label>
											<input type="number" value={pForm.price} onChange={e => setPForm({ ...pForm, price: e.target.value })} placeholder="0" />
										</div>
										<div className="ka-field">
											<label>Stok</label>
											<input type="number" value={pForm.stock} onChange={e => setPForm({ ...pForm, stock: e.target.value })} placeholder="0" />
										</div>
									</div>
									<div className="ka-field">
										<label>Kategori</label>
										<input value={pForm.category} onChange={e => setPForm({ ...pForm, category: e.target.value })} placeholder="Contoh: Minuman" />
									</div>

									<div className="ka-recipe-section">
										<label>Resep Bahan Baku (Opsional, untuk hitung HPP)</label>
										{(pForm.recipe || []).map((r, idx) => {
											const item = expenseItems.find(it => it.id === r.expenseItemId);
											return (
												<div className="ka-recipe-row" key={idx}>
													<select value={r.expenseItemId} onChange={e => updateRecipeRow(idx, { expenseItemId: e.target.value })}>
														{expenseItems.map(it => <option key={it.id} value={it.id}>{it.name}</option>)}
													</select>
													<input type="number" step="any" placeholder="jml" value={r.qty} onChange={e => updateRecipeRow(idx, { qty: e.target.value })} />
													<span className="unit">{item && item.unit ? item.unit : ''}</span>
													<button className="ka-icon-btn del" onClick={() => removeRecipeRow(idx)}><Ico size={13}>🗑️</Ico></button>
												</div>
											);
										})}
										<button className="ka-btn ghost" style={{ paddingLeft: 0 }} onClick={addRecipeRow} disabled={expenseItems.length === 0}><Ico size={13}>➕</Ico> Tambah Bahan</button>

										<div className="ka-field" style={{ marginTop: 10, marginBottom: 10 }}>
											<label style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
												<span>Hasil Resep / Jumlah Porsi (Yield)</span>
												<span style={{ fontSize: 11, fontWeight: 400, color: 'var(--ink-soft)' }}>Default: 1 porsi</span>
											</label>
											<div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
												<input
													type="number"
													min="1"
													step="any"
													value={pForm.portionYield}
													onChange={e => setPForm({ ...pForm, portionYield: e.target.value })}
													placeholder="1"
													style={{ width: '100px' }}
												/>
												<span style={{ fontSize: 12.5, color: 'var(--ink-soft)' }}>porsi / cup hasil jadi</span>
											</div>
											<p style={{ fontSize: 11, color: 'var(--ink-soft)', margin: '4px 0 0' }}>
												Contoh: Jika takaran resep di atas untuk 1 batch adonan yang menghasilkan 18 cup, isi <strong>18</strong>.
											</p>
										</div>

										{(pForm.recipe || []).length > 0 && (
											<div style={{ background: 'var(--paper-light)', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 12px', marginTop: 8 }}>
												{curYield > 1 && (
													<div className="ka-row" style={{ fontSize: 12, color: 'var(--ink-soft)', marginBottom: 4 }}>
														<span>Total Biaya Resep 1 Batch:</span>
														<span className="mono">{formatRupiah(curBatchCost)}</span>
													</div>
												)}
												<div className="ka-row" style={{ fontWeight: 600, marginBottom: 0 }}>
													<span>Estimasi HPP per Porsi:</span>
													<span className="mono" style={{ color: 'var(--ink)', fontSize: 14 }}>
														{formatRupiah(curHpp)}
														{curYield > 1 && <span style={{ fontSize: 11, fontWeight: 400, color: 'var(--ink-soft)', marginLeft: 4 }}>(÷ {curYield} porsi)</span>}
													</span>
												</div>
											</div>
										)}
									</div>

									{/* Kalkulator Margin & Rekomendasi Harga Jual */}
									{curHpp > 0 && (
										<div className="ka-calc-card">
											<div className="ka-calc-title">
												<span>💡 Kalkulator Margin & Rekomendasi Harga</span>
												<span className="mono" style={{ fontSize: 11, color: 'var(--ink-soft)' }}>HPP: {formatRupiah(curHpp)}/porsi</span>
											</div>

											<div style={{ marginBottom: 10 }}>
												<div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
													<label style={{ fontSize: 11.5, fontWeight: 600, color: 'var(--ink-soft)' }}>Target Margin Keuntungan:</label>
													<div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
														<input
															type="number"
															min="1"
															max="99"
															value={pForm.targetMargin}
															onChange={e => setPForm({ ...pForm, targetMargin: e.target.value })}
															style={{ width: '50px', padding: '4px 6px', textAlign: 'center', fontSize: 12, borderRadius: 6, border: '1px solid var(--border)', fontFamily: "'IBM Plex Mono', monospace" }}
														/>
														<span style={{ fontSize: 12, fontWeight: 600 }}>%</span>
													</div>
												</div>
												<div className="ka-chip-group">
													{[30, 40, 50, 60, 70, 75].map(pct => (
														<button
															key={pct}
															type="button"
															className={`ka-mini-chip ${String(pct) === String(pForm.targetMargin) ? 'active' : ''}`}
															onClick={() => setPForm({ ...pForm, targetMargin: String(pct) })}
														>
															{pct}%
														</button>
													))}
												</div>
											</div>

											<div className="ka-rec-box">
												<div style={{ fontSize: 11, color: 'var(--ink-soft)', marginBottom: 4 }}>
													Saran Harga Jual (Target Margin {targetMarginVal}%):
												</div>
												<div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
													<span className="mono" style={{ fontSize: 15, fontWeight: 700, color: 'var(--rust)' }}>
														{formatRupiah(recPriceExact)}
													</span>
													<div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
														<button
															type="button"
															className="ka-apply-btn"
															onClick={() => setPForm({ ...pForm, price: String(Math.round(recPriceExact)) })}
															title="Terapkan harga persis"
														>
															Gunakan Pas ({formatRupiah(recPriceExact)})
														</button>
														{recPriceRound500 !== Math.round(recPriceExact) && (
															<button
																type="button"
																className="ka-apply-btn"
																onClick={() => setPForm({ ...pForm, price: String(recPriceRound500) })}
																title="Terapkan harga dibulatkan"
															>
																Bulatkan ({formatRupiah(recPriceRound500)})
															</button>
														)}
													</div>
												</div>
											</div>

											{curPrice > 0 && (
												<div>
													<div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 10 }}>
														<div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 6, padding: '7px 9px' }}>
															<div style={{ fontSize: 10.5, color: 'var(--ink-soft)' }}>Untung per Porsi</div>
															<div className="mono" style={{ fontSize: 13, fontWeight: 700, color: curProfit < 0 ? 'var(--danger)' : 'var(--accent)' }}>
																{curProfit >= 0 ? '+' : ''}{formatRupiah(curProfit)}
															</div>
														</div>
														<div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 6, padding: '7px 9px' }}>
															<div style={{ fontSize: 10.5, color: 'var(--ink-soft)' }}>Margin Nyata</div>
															<div className="mono" style={{ fontSize: 13, fontWeight: 700, color: curProfit < 0 ? 'var(--danger)' : curMarginPct < 30 ? '#B56200' : 'var(--accent)' }}>
																{curMarginPct.toFixed(1)}%
															</div>
														</div>
													</div>

													<div className={`ka-stat-badge ${curProfit < 0 ? 'danger' : curMarginPct < 30 ? 'warning' : 'success'}`}>
														{curProfit < 0 ? (
															<span>⚠️ Rugi {formatRupiah(Math.abs(curProfit))} / porsi! Naikkan harga jual atau kurangi bahan.</span>
														) : curMarginPct < 30 ? (
															<span>⚠️ Margin tipis ({curMarginPct.toFixed(1)}%). Pertimbangkan naikkan harga jual.</span>
														) : (
															<span>✅ Margin sehat ({curMarginPct.toFixed(1)}%). Untung {formatRupiah(curProfit)} / porsi.</span>
														)}
													</div>
												</div>
											)}
										</div>
									)}

									<div className="ka-modal-actions">
										<button className="ka-btn secondary" onClick={closeProductModal}>Batal</button>
										<button className="ka-btn primary" onClick={submitProduct}>Simpan</button>
									</div>
								</div>
							</div>
						);
					})()}

					{expenseItemModal && (
						<div className="ka-modal-overlay" onClick={() => setExpenseItemModal(null)}>
							<div className="ka-modal" onClick={e => e.stopPropagation()}>
								<h3>
									{expenseItemModal === 'new' ? 'Item Bahan Baru' : 'Edit Bahan'}
									<button onClick={() => setExpenseItemModal(null)}><Ico size={18}>✖️</Ico></button>
								</h3>
								<div className="ka-field">
									<label>Nama Bahan</label>
									<input value={eiForm.name} onChange={e => setEiForm({ ...eiForm, name: e.target.value })} placeholder="Contoh: Gelas 22 oz" />
								</div>
								<div className="ka-field-row">
									<div className="ka-field">
										<label>Kuantitas Beli</label>
										<input type="number" value={eiForm.qtyBeli} onChange={e => setEiForm({ ...eiForm, qtyBeli: e.target.value })} placeholder="1" />
									</div>
									<div className="ka-field">
										<label>Satuan</label>
										<input value={eiForm.unit} onChange={e => setEiForm({ ...eiForm, unit: e.target.value })} placeholder="kg / pcs / ml" />
									</div>
								</div>
								<div className="ka-field">
									<label>Total Harga Beli (Rp)</label>
									<input type="number" value={eiForm.price} onChange={e => setEiForm({ ...eiForm, price: e.target.value })} placeholder="0" />
									{eiForm.price && eiForm.qtyBeli && parseFloat(eiForm.qtyBeli) > 0 && (
										<p style={{ fontSize: 11, color: 'var(--ink-soft)', marginTop: 4 }}>
											Estimasi Harga per {eiForm.unit || 'unit'}: {formatRupiah(parseFloat(eiForm.price) / parseFloat(eiForm.qtyBeli))}
										</p>
									)}
								</div>
								<div className="ka-modal-actions">
									<button className="ka-btn secondary" onClick={() => setExpenseItemModal(null)}>Batal</button>
									<button className="ka-btn primary" onClick={submitExpenseItem}>Simpan</button>
								</div>
							</div>
						</div>
					)}

					{showLogExpense && (
						<div className="ka-modal-overlay" onClick={() => { setShowLogExpense(false); setEditingExpenseEntryId(null); }}>
							<div className="ka-modal" onClick={e => e.stopPropagation()}>
								<h3>
									{editingExpenseEntryId ? 'Edit Pengeluaran' : 'Catat Pengeluaran'}
									<button onClick={() => { setShowLogExpense(false); setEditingExpenseEntryId(null); }}><Ico size={18}>✖️</Ico></button>
								</h3>
								<div className="ka-field">
									<label>Bahan</label>
									<select
										value={logForm.itemId}
										onChange={e => {
											const item = expenseItems.find(it => it.id === e.target.value);
											setLogForm({ ...logForm, itemId: e.target.value, unitPrice: item ? String(item.price) : '' });
										}}
										style={{ width: '100%', padding: '9px 11px', border: '1px solid var(--border)', borderRadius: 8, fontSize: 13.5, fontFamily: "'IBM Plex Sans', sans-serif" }}
									>
										{expenseItems.map(it => (
											<option key={it.id} value={it.id}>{it.name} {it.qtyBeli ? `(kemasan ${it.qtyBeli} ${it.unit || ''})` : it.unit ? `(${it.unit})` : ''}</option>
										))}
									</select>
								</div>
								<div className="ka-field-row">
									<div className="ka-field">
										<label>Jml Pembelian</label>
										<input type="number" value={logForm.qty} onChange={e => setLogForm({ ...logForm, qty: e.target.value })} placeholder="1" />
									</div>
									<div className="ka-field">
										<label>Harga/Kemasan (Rp)</label>
										<input type="number" value={logForm.unitPrice} onChange={e => setLogForm({ ...logForm, unitPrice: e.target.value })} placeholder="0" />
									</div>
								</div>
								<div className="ka-row total" style={{ borderTop: '1px solid var(--border)', paddingTop: 10 }}>
									<span>Total</span>
									<span>{formatRupiah((parseFloat(logForm.qty) || 0) * (parseFloat(logForm.unitPrice) || 0))}</span>
								</div>
								<div className="ka-modal-actions">
									<button className="ka-btn secondary" onClick={() => { setShowLogExpense(false); setEditingExpenseEntryId(null); }}>Batal</button>
									<button className="ka-btn primary" onClick={submitLogExpense}>Simpan</button>
								</div>
							</div>
						</div>
					)}

					{showHeldList && (
						<div className="ka-modal-overlay" onClick={() => setShowHeldList(false)}>
							<div className="ka-modal" onClick={e => e.stopPropagation()}>
								<h3>
									Transaksi Tertahan
									<button onClick={() => setShowHeldList(false)}><Ico size={18}>✖️</Ico></button>
								</h3>
								{heldCarts.length === 0 ? (
									<p style={{ fontSize: 13, color: 'var(--ink-soft)' }}>Tidak ada transaksi yang ditahan.</p>
								) : (
									<div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
										{heldCarts.map(h => {
											const total = h.cart.reduce((s, c) => s + c.price * c.qty, 0);
											return (
												<div key={h.id} className="ka-trx-card" style={{ cursor: 'default' }}>
													<div className="ka-trx-head">
														<span className="id">{new Date(h.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} · {h.cart.length} item</span>
														<span className="total">{formatRupiah(total)}</span>
													</div>
													<div className="ka-trx-sub" style={{ marginBottom: 8 }}>{h.cart.map(c => c.name).join(', ')}</div>
													<div className="ka-trx-actions">
														<button className="ka-btn danger" onClick={() => deleteHeldCart(h.id)}><Ico size={13}>🗑️</Ico> Hapus</button>
														<button className="ka-btn primary" onClick={() => resumeHeldCart(h)}>Lanjutkan</button>
													</div>
												</div>
											);
										})}
									</div>
								)}
							</div>
						</div>
					)}

					{showSettings && (
						<div className="ka-modal-overlay" onClick={() => setShowSettings(false)}>
							<div className="ka-modal" onClick={e => e.stopPropagation()}>
								<h3>
									Pengaturan Toko
									<button onClick={() => setShowSettings(false)}><Ico size={18}>✖️</Ico></button>
								</h3>
								<div className="ka-field">
									<label>Nama Toko</label>
									<input value={settingsForm.name} onChange={e => setSettingsForm({ ...settingsForm, name: e.target.value })} placeholder="Contoh: Toko Kopi Senja" />
								</div>
								<div className="ka-field">
									<label>Logo (muncul di struk)</label>
									{settingsForm.logo && (
										<div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
											<img src={settingsForm.logo} alt="logo" style={{ width: 48, height: 48, objectFit: 'contain', borderRadius: 8, border: '1px solid var(--border)' }} />
											<button className="ka-btn ghost" onClick={() => setSettingsForm({ ...settingsForm, logo: null })}><Ico size={13}>🗑️</Ico> Hapus logo</button>
										</div>
									)}
									<input type="file" accept="image/*" onChange={handleLogoUpload} />
								</div>
								<div className="ka-modal-actions">
									<button className="ka-btn secondary" onClick={() => setShowSettings(false)}>Batal</button>
									<button className="ka-btn primary" onClick={submitSettings}>Simpan</button>
								</div>
								<div className="ka-backup-section">
									<label>Laporan Excel</label>
									<p>Unduh laporan bisnis lengkap (.xlsx): ringkasan margin & insight, harian/mingguan/bulanan, per menu, jam ramai, transaksi, pengeluaran.</p>
									<div className="ka-modal-actions" style={{ marginTop: 0 }}>
										<button className="ka-btn primary" onClick={exportExcelReport}>📊 Export Laporan Excel</button>
									</div>
									<label style={{ marginTop: 18 }}>Backup Data (untuk memulihkan)</label>
									<p>File JSON ini bukan buat dibaca di Excel. Fungsinya cuma buat memulihkan semua data kalau HP ganti atau aplikasi terhapus.</p>
									<div className="ka-modal-actions">
										<button className="ka-btn secondary" onClick={exportAllData}><Ico size={14}>📤</Ico> Backup JSON</button>
										<label className="ka-btn secondary" style={{ cursor: 'pointer', textAlign: 'center' }}>
											<Ico size={14}>➕</Ico> Import Data
											<input type="file" accept="application/json" onChange={importAllData} style={{ display: 'none' }} />
										</label>
									</div>
								</div>
							</div>
						</div>
					)}

					{showReceipt && lastTransaction && (
						<div className="ka-modal-overlay" onClick={() => setShowReceipt(false)}>
							<div className="ka-modal" onClick={e => e.stopPropagation()}>
								<h3>
									Struk Transaksi
									<button onClick={() => setShowReceipt(false)}><Ico size={18}>✖️</Ico></button>
								</h3>
								<div id="receipt-content">
									<div className="ka-receipt-head">
										{storeSettings.logo && <img src={storeSettings.logo} alt="logo" style={{ width: 44, height: 44, objectFit: 'contain', margin: '0 auto 6px' }} />}
										<div className="store">{storeSettings.name || 'Toko Saya'}</div>
										<div className="meta">{formatDateTime(lastTransaction.timestamp)}</div>
										<div className="meta">No. #{lastTransaction.id}</div>
									</div>
									<div className="ka-receipt-divider" />
									{lastTransaction.items.map((it, i) => (
										<div className="ka-receipt-line" key={i}>
											<span>{it.name}<br /><span className="qp">{it.qty} × {formatRupiah(it.price)}</span></span>
											<span>{formatRupiah(it.price * it.qty)}</span>
										</div>
									))}
									<div className="ka-receipt-divider" />
									{lastTransaction.discountAmount > 0 && (
										<>
											<div className="ka-receipt-line"><span>Subtotal</span><span>{formatRupiah(lastTransaction.subtotal)}</span></div>
											<div className="ka-receipt-line"><span>Diskon ({lastTransaction.discountPercent}%)</span><span>-{formatRupiah(lastTransaction.discountAmount)}</span></div>
										</>
									)}
									<div className="ka-receipt-total-row"><span>Total</span><span>{formatRupiah(lastTransaction.total)}</span></div>
									<div className="ka-receipt-line"><span>Bayar via</span><span>{lastTransaction.paymentMethod === 'qris' ? 'QRIS' : 'Tunai'}</span></div>
									{lastTransaction.paymentMethod !== 'qris' && (
										<>
											<div className="ka-receipt-line"><span>Tunai</span><span>{formatRupiah(lastTransaction.cash)}</span></div>
											<div className="ka-receipt-line"><span>Kembali</span><span>{formatRupiah(lastTransaction.change)}</span></div>
										</>
									)}
									<div className="ka-receipt-divider" />
									<div style={{ textAlign: 'center', fontSize: 11.5, color: '#6B7268', marginTop: 10 }}>Terima kasih atas kunjungan Anda</div>
								</div>
								<div className="ka-modal-actions" style={{ flexWrap: 'wrap' }}>
									<button className="ka-btn secondary" onClick={() => setShowReceipt(false)}>Tutup</button>
									<button className="ka-btn secondary" onClick={shareOrSaveReceipt}><Ico size={15}>📤</Ico> Bagikan/Simpan</button>
									<button className="ka-btn secondary" onClick={printViaBluetooth} disabled={btPrinting}>
										{btPrinting ? 'Menghubungkan…' : <><Ico size={15}>🖨️</Ico> Bluetooth</>}
									</button>
									<button className="ka-btn primary" onClick={printReceipt}><Ico size={15}>🖨️</Ico> Cetak</button>
								</div>
								<p style={{ fontSize: 10.5, color: 'var(--ink-soft)', marginTop: 8, marginBottom: 0 }}>Cetak Bluetooth hanya berfungsi di Chrome Android dengan printer thermal yang sudah di-pairing.</p>
							</div>
						</div>
					)}
				</div>
			);
		}


		const root = ReactDOM.createRoot(document.getElementById('root'));
		root.render(<KasirApp />);
	</script>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('sw.js').catch(() => { });
			});
		}
	</script>
</body>


</html>
